<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #232637;
  --border: #2e3250;
  --accent: #4f8ef7;
  --accent2: #7c5af7;
  --text: #e2e4f0;
  --text-muted: #8b8fa8;
  --green: #3ecf8e;
  --yellow: #f5a623;
  --red: #f76262;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  padding: 1.2rem 1.5rem;
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .03em; }
header .badge {
  font-size: .7rem;
  background: var(--accent2);
  padding: .2em .7em;
  border-radius: 99px;
  color: #fff;
}
header .built-at { font-size: .72rem; color: var(--text-muted); margin-left: auto; }

.main-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  padding: 1.5rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* ── Cards ── */
.section-title {
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: .8rem;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card.active { border-color: var(--accent); background: var(--surface2); }
.card-name { font-size: 1.1rem; font-weight: 700; margin-bottom: .3rem; }
.card-date { font-size: .72rem; color: var(--text-muted); margin-bottom: .6rem; }
.card-attacks { list-style: none; }
.card-attacks li {
  font-size: .78rem;
  padding: .18rem 0;
  color: var(--text);
  display: flex;
  gap: .4rem;
}
.card-attacks li::before { content: "▸"; color: var(--accent); flex-shrink: 0; }

/* ── Table ── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: .8rem;
}
th {
  background: var(--surface2);
  padding: .6rem .8rem;
  text-align: left;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: .55rem .8rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
}
tr:hover td { background: var(--surface2); }
tr.active-row td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.muni-link {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  font-weight: 600;
}
.muni-link:hover { text-decoration: underline; }

/* ── Detail panel ── */
#detail-panel {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.5rem;
}
#detail-panel.visible { display: block; }
#detail-panel h2 {
  font-size: 1rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: .6rem;
}
/* marked.js 出力スタイル */
#detail-content h1,#detail-content h2,#detail-content h3 {
  margin: 1.2em 0 .4em;
  line-height: 1.3;
}
#detail-content h1 { font-size: 1.3rem; }
#detail-content h2 { font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
#detail-content h3 { font-size: .95rem; color: var(--accent); }
#detail-content p { margin: .5em 0; line-height: 1.8; font-size: .88rem; }
#detail-content ul,#detail-content ol { padding-left: 1.4em; margin: .5em 0; font-size: .88rem; line-height: 1.8; }
#detail-content table { margin: .8em 0; }
#detail-content th { font-size: .78rem; }
#detail-content td { font-size: .78rem; }
#detail-content a { color: var(--accent); }
#detail-content strong { color: var(--yellow); }
#detail-content code {
  background: var(--surface2);
  padding: .1em .4em;
  border-radius: 4px;
  font-size: .85em;
}
#detail-close {
  float: right;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: .3rem .8rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: .8rem;
}
#detail-close:hover { border-color: var(--accent); color: var(--text); }

@media (min-width: 1024px) {
  .main-layout {
    grid-template-columns: 1fr 420px;
    grid-template-rows: auto auto 1fr;
  }
  .cards-section { grid-column: 1 / 2; }
  .table-section { grid-column: 1 / 2; }
  #detail-panel { grid-column: 2; grid-row: 1 / 4; display: block; position: sticky; top: 1rem; max-height: 90vh; overflow-y: auto; }
  #detail-panel:not(.visible) #detail-content { display: none; }
  #detail-panel:not(.visible)::after { content: "← 自治体を選ぶとレポートを表示"; display: block; color: var(--text-muted); font-size: .88rem; text-align: center; padding: 2rem; }
  #detail-close { display: none; }
}
</style>
</head>

報ポータルサイトの河川・道路カメラ映像取込（機能拡充） | 当初予算27,538千円・拡充。事業概要「河川・道路カメラ映像を集約公開」「国交省の河川カメラ画像取込」「総合防災情報システム連携」 | 森岡危機対策・情報課長 | 中（映像取込は既存保守契約枠内に吸収の可能性） | R7tousyosyuyouzigyou.pdf／https://tottori.bosai.info/ |\n| 5（保守・中長期） | 防災情報ポータルサイト構築・運用保守業務の後継調達（〜2030年3月満了） | 既存契約：公告2024-02-06、契約期間〜2030年3月31日、危機対策・情報課所管（総合評価一般競争入札の前例） | 森岡危機対策・情報課長 | 中（後継調達は2029〜2030年度に公告の蓋然性／推測） | https://www.jetro.go.jp/gov_procurement/local/articles/b042d46319656f32.html |\n| 6（保守・毎年度型） | 危機管理情報ネットワークシステム保守業務 | 令和4年度に単年度契約（令和4.4.1〜令和5.3.31）を確認。原資は当初予算「危機管理情報システム管理運営事業229,929千円」の可能性 | 森岡危機対策・情報課長 | 低（毎年度継続は推測。令和5年度以降の実在は未確認） | https://www.jetro.go.jp/gov_procurement/local/articles/270e63dec0718578.html |\n| 7（映像ハード） | 鳥取港湾事務所監視カメラ設備改修ほか工事 | 案件名のみ確認。発注者（鳥取県と推定）・公告日・予定価格は未確認（有料サービス掲載で詳細取得不可） | 未確認 | 低（数少ない映像ハード更新シグナルだが規模不明） | 案件名確認のみ。詳細未取得 |\n| 8（仕込み） | 山林火災の広域連携体制（首長最重点） | 知事「5月運用の新連携で自衛隊CH-47を3時間以内に投入判断、八頭町下野の火災は50分鎮圧・90分鎮火」(R8.3.17)／前田議員「東・中・西広域消防局・自衛隊の平時連携が不可欠」(R8.3.17) | 知事、黒見消防防災課長 | 高 | https://www.pref.tottori.dbsr.jp/（DocumentID=2619） |\n| 9（仕込み） | 冬季倒木停電・事前伐採（孤立対策／部長が残課題を明言） | 浜田部長「事前伐採179か所中115完了〔64%〕、未完34地区は鳥取市13・琴浦町10、停電件数を令和4年131件→令和7年81件へ約4割削減」(R8.3.13)／予算「危険木事前伐採集中対策事業20,000千円」 | 浜田危機管理部長 | 高 | https://www.pref.tottori.dbsr.jp/（DocumentID=2618） |\n\n### 映像系の構造整理（営業的意味）\n- ポータル映像取込（27,538千円）は新規構築ではなく令和6年度構築済みポータルへの機能拡充。映像インフラそのものより「集約・連携・配信ソフト」側に予算が向いている（事業概要原文）。\n- そのソフト側は「構築・運用保守業務」（〜2030年3月、危機対策・情報課）の既存契約に包含される構造。参入は既存受託者への協力／二次委託、または2030年更新時の後継調達がポイント（推測・確度中）。\n- 映像の高度化（AI解析・冠水/越水検知・低帯域映像伝送等）はポータル拡充や砂防DX構築（公告済み）の付加機能として提案する余地（推測）。\n\n### 保守契約のパターン（観測→推測の分離）\n- **観測（事実）**: ①ポータルサイト構築・運用保守＝複数年一括契約（〜2030年3月）。②危機管理情報ネットワークシステム保守＝令和4年度は単年度契約。③設備点検・防災行政無線エアコン点検等＝年度名を冠した点検委託が存在。\n- **推測（確度低〜中）**: 単年度保守（②③型）は毎年度継続公告される定常需要の可能性→「今年度の公告タイミング」で当たる。複数年型（①）は満了年度（2029〜2030年度）に後継調達が集中→「満了前年度の仕込み」で当たる。ただし②の令和5年度以降の実在は未確認のため断定しない。\n\n## 3. キーパーソン\n| 名前・役職 | 関心テーマ | 接触ヒント |\n|---|---|---|\n| 知事（平井伸治） | ぼうさいこくたい2026、鳥取型防災、山林火災CH-47連携、広島との防災情報システム共同運用(R8.3.2・3.17本会議) | 最上位方針決定者。提案は知事メッセージとの整合が訴求の鍵 |\n| 危機管理部長（浜 function showDetail(idx) {
  const d = DATA[idx];
  document.getElementById('detail-title').textContent = d.name + ' / ' + d.source;
  document.getElementById('detail-content').innerHTML = marked.parse(d.markdown);
  const panel = document.getElementById('detail-panel');
  panel.classList.add('visible');
  // card highlight
  document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i === idx));
  document.querySelectorAll('#table-body tr').forEach((r, i) => r.classList.toggle('active-row', i === idx));
  // mobile scroll
  if (window.innerWidth < 1024) panel.scrollIntoView({ behavior: 'smooth' });
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('#table-body tr').forEach(r => r.classList.remove('active-row'));
}

function buildCards() {
  const wrap = document.getElementById('cards');
  DATA.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-name">${d.name}</div>
      <div class="card-date">更新: ${d.date} &nbsp;|&nbsp; ${d.source}</div>
      <ul class="card-attacks">${d.attacks.map(a => `<li>${a}</li>`).join('')}</ul>
    `;
    el.addEventListener('click', () => showDetail(i));
    wrap.appendChild(el);
  });
}

function buildTable() {
  const tbody = document.getElementById('table-body');
  DATA.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a class="muni-link" onclick="showDetail(${i})">${d.name}</a></td>
      <td>${d.top_attack}</td>
      <td>${d.keypersons}</td>
      <td style="max-width:240px;font-size:.75rem">${d.max_opportunity}</td>
      <td style="white-space:nowrap">${d.date}</td>
    `;
    tbody.appendChild(tr);
  });
}
