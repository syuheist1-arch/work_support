未発注の可能性。入札公告ページで状況確認。\n4. **【中期・令和8〜9年度】地域防災計画改定支援**: 施政方針で明言された計画改定の進捗を確認。R8年度内に改定完了予定かどうかを問い合わせ、未完であれば支援提案。\n\n## 要確認事項（検証で棄却・未確認だったもの）\n\n- **入札公告の個別案件**: 防災行政無線更新・耐震性貯水槽・ハザードマップ委託の発注実績/入札予定が未確認。\n- **令和8年度消防費の委組合負担金内訳**: 消防費269,952千円のうち西部広域行政管理組合への負担金額が分離不可。\n- **令和8年度施政方針の防災関連内容**: 施政方針PDFがスキャン画像形式のためテキスト抽出不可。\n- **議員の一般質問・委員会審議発言（R7〜R8）**: 会議録検索システム（kensakusystem.jp/houki）がShift-JIS系エンコードでテキスト抽出不可。\n- **ため池監視システムの予算単独計上の有無**: 施政方針で言及あるが、R8予算でため池防災減災対策推進事業15,000千円は廃止工事のみ（監視システムの単独計上なし）。別途事業がある可能性は未確認。\n- **補正予算（R7第1〜6号のうち未取得分）の防災関連内容**: バイナリ/スキャン形式のため未確認。\n\n## 出典一覧（取得日: いずれも2026-06-02）\n\n| URL | 資料名 | 発行日 |\n|-----|--------|--------|\n| https://www.houki-town.jp/user/filer_public/a7/c6/a7c690dc-3749-495a-939d-c6ef650df9be/dang-chu-yu-suan-shuo-ming-zi-liao.pdf | 令和8年度当初予算説明資料概要 | 2026/02/25 |\n| https://www.houki-town.jp/user/filer_public/ce/78/ce787272-ef1e-4d49-89ec-814a698156d7/dang-chu-yu-suan-shuo-ming-zi-liao-gai-yao.pdf | 令和7年度当初予算説明資料概要 | 2025/02/27 |\n| https://www.houki-town.jp/user/filer_public/97/27/9727ec2d-7cc1-4908-9d5f-df0c82bcf407/bu-zheng-yu-suan-7hao.pdf | 令和7年度補正予算第7号説明資料 | 2026/02/25 |\n| https://www.houki-town.jp/new1/10/2/r266/r875/ | 令和7年度施政方針（令和7年第1回定例会） | 2025/03/17 |\n"}, {"name": "倉吉市", "prefecture": "鳥取県", "source": "report.md", "date": "2026-06-03", "attacks": ["橋梁補修工事・設計・点検（道路更新防災等対策事業）", "消防庁舎建設（鳥取中部ふるさと広域連合）", "河川改修・護岸整備（河川総務及び維持）"], "top_attack": "橋梁補修工事・設計・点検（道路更新防災等対策事業）", "keypersons": "-", "max_opportunity": "-", "status": {"公告済み": 0, "予算化・未公告": 5, "仕込み": 1}, "musen_alert": false, "markdown": "# 営業支援レポート: 倉吉市 / 防災\n- 作成日: 2026-06-03\n- 対象資料: 令和8年度当初予算（全事業一覧 R8zenzigyou.pdf、391ページ）\n\n## エグゼクティブサマリー（5行以内）\n\n- 防災行政無線は令和5〜7年度に更新完了済み。R8は保守点検のみ（14,628千円）のため、無線更新の提案機会はない。\n- 常備消防事業（鳥取中部ふるさと広域連合負担金）が795,514千円（R7比+84,884千円）と大幅増。うち消防庁舎建設費34,654千円が計上されており、広域連合を通じた庁舎整備案件が進行中。\n- 道路更新防災等対策事業（橋梁補修）が337,144千円（R7比+110,094千円）と最大の増額。橋梁補修工事3橋・設計10橋・点検153橋が発注対象。\n- 建築物耐震化支援が51,817千円（R7比+6,961千円）に拡充。補助上限額が引き上げられており、診断・改修需要が増加する見込み。\n- 防災安全課 典のない主張・推測の断定は本文から除外し「要確認事項」に隔離した。\n\n## 1. エグゼクティブサマリー（5行）\n- 【最重要・入札前の好機】危機対策・情報課所管の「**災害対策本部設備機能強化事業**」がR8で予算化済みだが**調達未実施**（155,146千円／複数年計381,843千円・R9に重心）。入札公告前のいま要件形成・情報提供で正規に関与できる最有力タイミング（確度中）。\n- 【映像ハード・5年契約】原子力安全対策課「原子力防災情報システム維持運用事業」で**県内47か所の監視カメラ更新＋映像配信システム整備**が令和8年4月〜令和13年3月の5年計画で確定（総額25,101千円）。\n- 首長（平井知事）の最上位方針は「ぼうさいこくたい2026 in 鳥取（令和8年10月、倉吉市）」「鳥取型防災」「山林火災の広域連携（自衛隊CH-47を3時間以内に投入判断する5月運用の新体制）」と本会議答弁で確認（確度高）。\n- 「今すぐ動ける案件」として令和8年度の入札公告が複数確定（災害時通信手段見直し・公告2026-05-21、砂防まるっとDX構築・公告2026-05-08、スマホ自主防災支援・公告2026-04-24）。\n- 「短期の仕込み」は冬季倒木停電の事前伐採（残34地区が未完）・避難所TKB拡充など、議員と部長が残課題を具体名で明言したテーマ。\n\n## 2. 攻めどころ（優先順位つき）\n\n| 順位 | 提案テーマ | 根拠（予算/発言の事実） | 想定キーパーソン | 確度 | 出典 |\n|------|-----------|------------------------|------------------|------|------|\n| 1（最優先・入札前） | 【予算化・未公告】災害対策本部設備機能強化事業（調達未実施） | R8当初152,737千円＋補正2,409千円＝155,146千円。所管=危機対策・情報課。事業名はユーザー確認（予算DB文字化けで不読だが事業は特定済み） | 危機対策・情報課（0857-26-7789 / kikitaisaku-jouhou@pref.tottori.lg.jp） | 中 | https://db.pref.tottori.jp/yosan/R8Yosan_Koukai.nsf/72079a474c40091b4925747f002bb433/1bde4a787eba1b0449258d8f00328f15?OpenDocument |\n| 2（最優先・複数年） | 【予算化・未公告】同事業 複数年計画（R8〜R9計381,843千円） | 総額381,843千円（R8:152,737＋R9:229,106）。R9に重心の2か年構造。 | 危機対策・情報課（同上） | 中 | https://db.pref.tottori.jp/yosan/R8Yosan_Koukai.nsf/72079a474c40091b4925747f002bb433/01312eef0365638049258d8f00328f1c?OpenDocument |\n| 3（映像ハード・5年） | 【予算化・未公告】原子力防災情報システム維持運用事業（47か所監視カメラ更新・映像配信） | 47か所カメラ更新＋映像配信。R8.4〜R13.3（5年）。総額25,101千円（R9:7,930／R10-R12各4,384／R13:4,019） | 原子力安全対策課（0857-26-7854 / genshiryoku-anzen@pref.tottori.lg.jp） | 中 | https://db.pref.tottori.jp/yosan/R8Yosan_Koukai.nsf/72079a474c40091b4925747f002bb433/821f89ff12f7a6f149258d8f00328f19?OpenDocument |\n| 4（今すぐ） | 【公告済み】令和8年度 災害時通信手段見直し業務 | 委託・制限付一般競争入札、公告2026-05-21／森岡課長「衛星系第三世代移行・悪天候時受信改善・400万円補正」(R7.12.17)／予算「危機管理通信ネットワーク機能向上281,958千円」 | 森岡危機対策・情報課長 | 高（公告は事実）／狙いは中 | https://www.pref.tottori.lg.jp/322341.htm |\n| 5（今すぐ） | 【公告済み】砂防関係まるっとDXシステム構築業務委託 | 委託・システム構築、公告2026-05-08／藤井課長「ドローン・衛星回線・GISで災害調査効率化、電波不感地から映像伝送」 let currentIdx = -1;

const SECTIONS = [
  { key: 'summary',  label: 'サマリー',       re: /エグゼクティブ|サマリ/ },
  { key: 'attacks',  label: '攻めどころ',      re: /攻めどころ/ },
  { key: 'budget',   label: '防災予算',        re: /防災予算/ },
  { key: 'minutes',  label: '議会・首長の関心', re: /議会|首長/ },
  { key: 'actions',  label: '次アクション',    re: /次アクション/ },
  { key: 'issues',   label: '要確認事項',      re: /要確認/ },
];

function parseSections(markdown) {
  const result = {};
  const lines = markdown.split('\n');
  let cur = null;
  for (const line of lines) {
    if (line.startsWith('## ')) {
      const heading = line.slice(3).trim();
      cur = null;
      for (const s of SECTIONS) {
        if (s.re.test(heading)) { cur = s.key; result[cur] = result[cur] || []; break; }
      }
    } else if (cur) {
      result[cur].push(line);
    }
  }
  for (const k of Object.keys(result)) {
    while (result[k].length && !result[k][0].trim()) result[k].shift();
    while (result[k].length && !result[k][result[k].length-1].trim()) result[k].pop();
  }
  return result;
}

function renderMd(lines) {
  const md = lines.join('\n');
  let html = marked.parse(md);
  html = html.replace(/<table>/g, '<div class="tbl-wrap"><table>').replace(/<\/table>/g, '</table></div>');
  return `<div class="dp-body">${html}</div>`;
}

function badgesHtml(s) {
  return [
    s['公告済み'] > 0      ? `<span class="badge-status badge-announced">公告済み ${s['公告済み']}件</span>` : '',
    s['予算化・未公告'] > 0 ? `<span class="badge-status badge-budgeted">予算化・未公告 ${s['予算化・未公告']}件</span>` : '',
    s['仕込み'] > 0         ? `<span class="badge-status badge-pipeline">仕込み ${s['仕込み']}件</span>` : '',
  ].filter(Boolean).join('');
}

function openModal(idx) {
  currentIdx = idx;
  const d = DATA[idx];

  document.getElementById('modal-title').textContent = d.name + ' / 防災';
  document.getElementById('modal-meta').textContent  = '更新: ' + d.date;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === DATA.length - 1;

  const sections = parseSections(d.markdown);

  // build tabs
  const tabBar     = document.getElementById('tab-bar');
  const tabContent = document.getElementById('tab-content');
  tabBar.innerHTML = '';
  tabContent.innerHTML = '';

  let firstKey = null;
  for (const s of SECTIONS) {
    if (!sections[s.key] || !sections[s.key].length) continue;
    if (!firstKey) firstKey = s.key;

    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.key = s.key;
    btn.textContent = s.label;
    btn.onclick = () => switchTab(s.key);
    tabBar.appendChild(btn);

    const pane = document.createElement('div');
    pane.className = 'tab-pane';
    pane.id = 'pane-' + s.key;
    pane.innerHTML = renderMd(sections[s.key]);
    tabContent.appendChild(pane);
  }

  if (firstKey) switchTab(firstKey);

  // highlight cards / table rows
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', +c.dataset.idx === idx));
  document.querySelectorAll('#table-body tr').forEach((r, i) => r.classList.toggle('active-row', i === idx));

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function switchTab(key) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + key));
  document.getElementById('tab-content').scrollTop = 0;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('#table-body tr').forEach(r => r.classList.remove('active-row'));

  currentIdx = -1;
}

function navigate(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < DATA.length) openModal(next);
}

function overlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

document.addEventListener('keydown', e => {
  const overlay = document.getElementById('modal-overlay');
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape')      closeModal();
  if (e.key === 'ArrowRight')  navigate(+1);
  if (e.key === 'ArrowLeft')   navigate(-1);
});

function buildCards() {
  // group by prefecture preserving insertion order
  const groups = [];
  const groupMap = {};
  DATA.forEach((d, i) => {
    const pref = d.prefecture || '—';
    if (!groupMap[pref]) {
      groupMap[pref] = [];
      groups.push({ pref, items: groupMap[pref] });
    }
    groupMap[pref].push({ d, i });
  });

  const container = document.getElementById('pref-groups');
  groups.forEach(({ pref, items }) => {
    const groupEl = document.createElement('div');
    groupEl.className = 'pref-group';

    const label = document.createElement('div');
    label.className = 'pref-label';
    label.textContent = pref;
    groupEl.appendChild(label);

    const cardsEl = document.createElement('div');
    cardsEl.className = 'cards';
    items.forEach(({ d, i }) => {
      const el = document.createElement('div');
      el.className = 'card' + (d.musen_alert ? ' musen-alert' : '');
      el.dataset.idx = i;
      el.innerHTML = `<div class="card-name">${d.name}</div>`;
      el.addEventListener('click', () => openModal(i));
      cardsEl.appendChild(el);
    });
    groupEl.appendChild(cardsEl);
    container.appendChild(groupEl);
  });

  document.getElementById('cards-title').textContent = `自治体一覧 (${DATA.length} 件)`;
}

function buildTable() {
  const tbody = document.getElementById('table-body');
  DATA.forEach((d, i) => {
    const s = d.status || {};
    const b = [
      s['公告済み'] > 0      ? `<span class="badge-status badge-announced">公告済み ${s['公告済み']}</span>` : '',
      s['予算化・未公告'] > 0 ? `<span class="badge-status badge-budgeted">予算化 ${s['予算化・未公告']}</span>` : '',
      s['仕込み'] > 0         ? `<span class="badge-status badge-pipeline">仕込み ${s['仕込み']}</span>` : '',
    ].filter(Boolean).join(' ');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a class="muni-link" onclick="openModal(${i})">${d.name}</a></td>
      <td style="white-space:nowrap">${b || '-'}</td>
      <td>${d.top_attack}</td>
      <td>${d.keypersons}</td>
      <td style="white-space:nowrap">${d.date}</td>`;
    tbody.appendChild(tr);
  });
}

buildCards();
buildTable();
</script>
</body>
</html>
