<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業支援 防災ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #232637;
  --border: #2e3250;
  --accent: #4f8ef7;
  --accent2: #7c5af7;
  --text: #e2e4f0;
  --text-muted: #8b8fa8;
  --green: #3ecf8e;
  --yellow: #f5a623;
  --red: #f76262;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  padding: 1.2rem 1.5rem;
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .03em; }
header .badge {
  font-size: .7rem;
  background: var(--accent2);
  padding: .2em .7em;
  border-radius: 99px;
  color: #fff;
}
header .built-at { font-size: .72rem; color: var(--text-muted); margin-left: auto; }

.main-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  padding: 1.5rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* ── Cards ── */
.section-title {
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: .8rem;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card.active { border-color: var(--accent); background: var(--surface2); }
.card-name { font-size: 1.1rem; font-weight: 700; margin-bottom: .3rem; }
.card-date { font-size: .72rem; color: var(--text-muted); margin-bottom: .6rem; }
.card-attacks { list-style: none; }
.card-attacks li {
  font-size: .78rem;
  padding: .18rem 0;
  color: var(--text);
  display: flex;
  gap: .4rem;
}
.card-attacks li::before { content: "▸"; color: var(--accent); flex-shrink: 0; }

/* ── Table ── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: .8rem;
}
th {
  background: var(--surface2);
  padding: .6rem .8rem;
  text-align: left;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: .55rem .8rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
}
tr:hover td { background: var(--surface2); }
tr.active-row td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.muni-link {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  font-weight: 600;
}
.muni-link:hover { text-decoration: underline; }

/* ── Detail panel ── */
#detail-panel {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.5rem;
}
#detail-panel.visible { display: block; }
#detail-panel h2 {
  font-size: 1rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: .6rem;
}
/* marked.js 出力スタイル */
#detail-content h1,#detail-content h2,#detail-content h3 {
  margin: 1.2em 0 .4em;
  line-height: 1.3;
}
#detail-content h1 { font-size: 1.3rem; }
#detail-content h2 { font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
#detail-content h3 { font-size: .95rem; color: var(--accent); }
#detail-content p { margin: .5em 0; line-height: 1.8; font-size: .88rem; }
#detail-content ul,#detail-content ol { padding-left: 1.4em; margin: .5em 0; font-size: .88rem; line-height: 1.8; }
#detail-content table { margin: .8em 0; }
#detail-content th { font-size: .78rem; }
#detail-content td { font-size: .78rem; }
#detail-content a { color: var(--accent); }
#detail-content strong { color: var(--yellow); }
#detail-content code {
  background: var(--surface2);
  padding: .1em .4em;
  border-radius: 4px;
  font-size: .85em;
}
#detail-close {
  float: right;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: .3rem .8rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: .8rem;
}
#detail-close:hover { border-color: var(--accent); color: var(--text); }

@media (min-width: 1024px) {
  .main-layout {
    grid-template-columns: 1fr 420px;
    grid-template-rows: auto auto 1fr;
  }
  .cards-section { grid-column: 1 / 2; }
  .table-section { grid-column: 1 / 2; }
  #detail-panel { grid-column: 2; grid-row: 1 / 4; display: block; position: sticky; top: 1rem; max-height: 90vh; overflow-y: auto; }
  #detail-panel:not(.visible) #detail-content { display: none; }
  #detail-panel:not(.visible)::after { content: "← 自治体を選ぶとレポートを表示"; display: block; color: var(--text-muted); font-size: .88rem; text-align: center; padding: 2rem; }
  #detail-close { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>🛡 営業支援 防災ダッシュボード</h1>
  <span class="badge">Phase 1</span>
  <span class="built-at">生成: 2026-06-01 10:36</span>
</header>

<div class="main-layout">
  <!-- カード一覧 -->
  <section class="cards-section">
    <div class="section-title">自治体一覧 (1 件)</div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- 比較表 -->
  <section class="table-section">
    <div class="section-title">横断比較表</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>自治体</th>
            <th>攻めどころ Top</th>
            <th>想定キーパーソン</th>
            <th>最大の機会</th>
            <th>更新日</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </section>

  <!-- 詳細パネル -->
  <div id="detail-panel">
    <h2 id="detail-title">レポート</h2>
    <button id="detail-close" onclick="closeDetail()">✕ 閉じる</button>
    <div id="detail-content"></div>
  </div>
</div>

<script>
const DATA = [{"name": "鳥取県", "source": "report.md", "date": "2026-06-01", "attacks": ["避難所環境整備・災害関連死対策パッケージ（TKB＋生活備蓄）", "防災DX（ドローン・GIS被災調査・衛星通信）", "地区防災計画の作成促進・住民主体の防災力向上"], "top_attack": "避難所環境整備・災害関連死対策パッケージ（TKB＋生活備蓄）", "keypersons": "浜田 危機管理部長、北村 危機管理部次長兼危機管理政策課長、木山 危機管理部次長兼危機管理政策課長", "max_opportunity": "直近の予算機会は令和8年度6月補正（2026-06-01概要公表済み）、最大の官民連携好機は令和8年10月「ぼうさいこくたい2026 in 鳥取（倉吉市）」。", "markdown": "# 営業支援レポート: 鳥取県 / 防災\n- 作成日: 2026-06-01\n- 対象資料: 予算（令和7年度当初予算ほか／収集日2026-06-01）、議事録（令和6年8月〜令和8年1月の地域県土警察・総務教育常任委員会／収集日2026-06-01）\n- QA担当による検証済み。出典のない主張・推測の断定は本文から除外し「データの限界・要確認事項」に隔離した。\n\n## 1. エグゼクティブサマリー（3行）\n- 防災関心は「避難所環境整備・災害関連死対策（TKB）」「防災DX（ドローン・GIS・衛星通信）」「原子力防災（屋内退避・要配慮者）」の3軸に集中（委員会発言ベース、確度高）。\n- 令和8年1月6日の島根県東部地震（M6.4、震度5強）の実対応を経験したばかりで、避難所・断水・備蓄が直近の生々しい論点になっている。\n- 直近の予算機会は令和8年度6月補正（2026-06-01概要公表済み）、最大の官民連携好機は令和8年10月「ぼうさいこくたい2026 in 鳥取（倉吉市）」。\n\n## 2. 攻めどころ Top3\n\n### 第1位: 避難所環境整備・災害関連死対策パッケージ（TKB＋生活備蓄） ／ 確度: 高\n- **根拠（事実）**: 福田次長「簡易ベッド・スポットクーラー30台、避難所環境整備が喫緊の課題」(R6.11.29)／北村次長「空気清浄機1,000台無償提供、災害関連死を防ぎたい」エアドッグ協定(R7.9.12)／森委員「島根県東部地震で紙コップ・紙皿の支給が必要」(R8.1.21)。予算「TKB24プロジェクト58,792千円（note転記・要照合）」。\n- **狙い時期**: 地震対応の振り返りが続く令和8年前半、6月補正〜当初予算編成期。\n\n### 第2位: 防災DX（ドローン・GIS被災調査・衛星通信） ／ 確度: 高\n- **根拠（事実）**: 藤井課長「ドローン・衛星回線の災害調査システムを出水期から実働、電波不感地域から映像伝送、GISで被災調査効率化」(R7.6.26)／木山課長「ドローン活用を進める必要、レスキューユニット設立」(R6.9.17)／森委員「人力減少の中ドローンをスピード感を持って」(R7.6.26)。予算「防災DX連携体制整備38,435千円」「ドローン活用推進5,500千円」（note転記・要照合）。\n- **狙い時期**: 出水期の実働運用後の改善ニーズ、令和8年度予算編成期。\n\n### 第3位: 地区防災計画の作成促進・住民主体の防災力向上 ／ 確度: 中\n- **根拠（事実）**: 木山次長「市町村と連携して地区防災計画の意義を県民に広報していく」と今後課題として言及(R7.10.6)。予算側に専用事業の明示なし（空白か収集漏れか未確定）。\n- **狙い時期**: 「ぼうさいこくたい2026」(令和8年10月17・18日、倉吉市、37団体)と連動、準備期の令和8年夏まで。\n\n## 3. キーパーソン\n| 名前・役職 | 関心テーマ | 接触ヒント |\n|---|---|---|\n| 浜田 危機管理部長 | 原子力防災・広域住民避難計画(R7.12.15) | 部の意思決定者 |\n| 北村 危機管理部次長兼危機管理政策課長 | 避難所災害関連死対策、県社協協定、南海トラフ受援(R7.7.22・9.12) | 協定・官民連携に積極。第1位の主担当 |\n| 木山 危機管理部次長兼危機管理政策課長 | 防災DX/ドローン、地区防災計画、備蓄(R6.9.17〜R8.1.21) | 前向き。第2・3位の窓口 |\n| 福田 危機管理部次長兼危機管理政策課長 | 避難所環境整備を「喫緊の課題」(R6.11.29) | 第1位の初期推進者 |\n| 森岡 危機対策・情報課長 | 通信ネットワーク衛星系移行(400万円補正)(R7.12.17) | 通信高度化の窓口 |\n| 藤井 技術企画課長（県土整備部） | 国土強靱化、ドローン・GIS災害調査(頻出) | 防災DXの県土側キーマン |\n| 中口 治山砂防課長 | 土砂災害警戒情報基準見直し(R7.8.21・R8.1.21) | 運用後改善の切り口で |\n| 森 委員（議員） | ドローン早期導入、多様性、生活備蓄 | 提案を後押ししやすい議員 |\n| 野坂 委員（議員） | 避難所のスフィア基準・民間連携(R7.1.23) | 民間連携を明示支持 |\n\n※役職注記: 木山氏はR6.9.17時点「危機対策・情報課長」、R7.10.6以降「危機管理部次長兼危機管理政策課長」と記録（矛盾ではなく時系列の役職変化）。接触前に現職確認を推奨。\n\n## 4. 次アクション\n1. 【〜2026年6月中旬】令和8年度6月補正概要PDF（財政課トップ公表済み）で防災の新規・増額を確認。\n2. 【〜2026年7月】北村次長・木山次長へ避難所環境整備／防災DX運用改善を打診（地震振り返りに合わせる）。\n3. 【〜2026年夏】ぼうさいこくたい2026事務局（黒見消防防災課長・大谷参事）に協賛/出展を打診。\n4. 【提案前必須】原資料PDFまたは予算事業検索DBで掲載金額を照合してから数値提示。\n5. 【補強】collector-minutes に本会議（知事・部長答弁）の追加収集を依頼し首長の重点方針を確認。\n\n## 5. データの限界・要確認事項\n- **予算金額はすべてnote民間記事（小沢瑞鶴氏）の転記、原資料PDF未照合**。商談で断定提示しない。\n- **前年比・増減は全事業「未確認」**。投資加速の推移判断は不可。\n- **令和6年度当初・各補正予算の防災事業/金額は取得不可**。補正の新規・増額シグナル確認できず。\n- **note記載の激甚化対策合計7,881,647千円は対応事業範囲が不明**のため本文不使用。\n- **本会議（知事・部長答弁）未取得**（検索システムがフレーム構造）。首長レベル方針は未確認。\n- **議事録は地域県土警察・総務教育委のみ**。福祉生活病院・農林水産商工委、令和7年4月以降の総務教育委等は未取得。\n- **「予算が薄い領域」判定は暫定**（事業網羅性が未担保、空白か収集漏れか未確定）。\n- **土砂災害警戒情報の見直しCL（令和8年5月運用開始予定）は本日時点で既に運用開始済みの可能性大**。提案は「運用後の改善・空振り低減」へ切替を。\n\n## 出典一覧（取得日: いずれも2026-06-01）\n- 予算掲載ページ: https://www.pref.tottori.lg.jp/321465.htm\n- 予算原資料PDF（読取不可・要照合）: https://www.pref.tottori.lg.jp/secure/1381609/R7tousyosyuyouzigyou.pdf\n- 予算転記元note: https://note.com/zuikaku_ozawa_/n/n6dd68f4af447\n- 予算事業検索DB: https://db.pref.tottori.jp/yosan/R7Yosan_Koukai.nsf/index.htm\n- 財政課トップ（令和8年度6月補正概要）: https://www.pref.tottori.lg.jp/zaiseika/\n- 議事録:\n  - R6.8.21: https://www.pref.tottori.lg.jp/item/1360288.htm\n  - R6.9.17: https://www.pref.tottori.lg.jp/item/1360290.htm\n  - R6.11.29: https://www.pref.tottori.lg.jp/item/1360293.htm\n  - R7.1.23（総務教育）: https://www.pref.tottori.lg.jp/item/1389348.htm\n  - R7.1.23（地域県土）: https://www.pref.tottori.lg.jp/item/1423234.htm\n  - R7.6.26: https://www.pref.tottori.lg.jp/item/1393891.htm\n  - R7.7.22: https://www.pref.tottori.lg.jp/item/1393892.htm\n  - R7.8.21: https://www.pref.tottori.lg.jp/item/1393893.htm\n  - R7.9.12: https://www.pref.tottori.lg.jp/item/1393894.htm\n  - R7.10.6: https://www.pref.tottori.lg.jp/item/1393895.htm\n  - R7.11.21: https://www.pref.tottori.lg.jp/item/1421213.htm\n  - R7.12.15: https://www.pref.tottori.lg.jp/item/1421214.htm\n  - R7.12.17: https://www.pref.tottori.lg.jp/item/1422653.htm\n  - R8.1.21: https://www.pref.tottori.lg.jp/item/1424438.htm\n- 本会議会議録検索（本文未取得）: https://www.pref.tottori.dbsr.jp/\n"}];

function showDetail(idx) {
  const d = DATA[idx];
  document.getElementById('detail-title').textContent = d.name + ' / ' + d.source;
  document.getElementById('detail-content').innerHTML = marked.parse(d.markdown);
  const panel = document.getElementById('detail-panel');
  panel.classList.add('visible');
  // card highlight
  document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i === idx));
  document.querySelectorAll('#table-body tr').forEach((r, i) => r.classList.toggle('active-row', i === idx));
  // mobile scroll
  if (window.innerWidth < 1024) panel.scrollIntoView({ behavior: 'smooth' });
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('#table-body tr').forEach(r => r.classList.remove('active-row'));
}

function buildCards() {
  const wrap = document.getElementById('cards');
  DATA.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-name">${d.name}</div>
      <div class="card-date">更新: ${d.date} &nbsp;|&nbsp; ${d.source}</div>
      <ul class="card-attacks">${d.attacks.map(a => `<li>${a}</li>`).join('')}</ul>
    `;
    el.addEventListener('click', () => showDetail(i));
    wrap.appendChild(el);
  });
}

function buildTable() {
  const tbody = document.getElementById('table-body');
  DATA.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a class="muni-link" onclick="showDetail(${i})">${d.name}</a></td>
      <td>${d.top_attack}</td>
      <td>${d.keypersons}</td>
      <td style="max-width:240px;font-size:.75rem">${d.max_opportunity}</td>
      <td style="white-space:nowrap">${d.date}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('cards').closest('.cards-section')
  .querySelector('.section-title').textContent =
  `自治体一覧 (${DATA.length} 件)`;

buildCards();
buildTable();
</script>
</body>
</html>
