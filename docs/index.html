<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>営業支援 防災ダッシュボード</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #232637;
  --border: #2e3250;
  --accent: #4f8ef7;
  --accent2: #7c5af7;
  --text: #e2e4f0;
  --text-muted: #8b8fa8;
  --green: #3ecf8e;
  --yellow: #f5a623;
  --red: #f76262;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  padding: 1.2rem 1.5rem;
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .03em; }
header .badge {
  font-size: .7rem;
  background: var(--accent2);
  padding: .2em .7em;
  border-radius: 99px;
  color: #fff;
}
header .built-at { font-size: .72rem; color: var(--text-muted); margin-left: auto; }

.main-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  padding: 1.5rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* ── Cards ── */
.section-title {
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: .8rem;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem;
  cursor: pointer;
  transition: border-color .15s, transform .1s;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card.active { border-color: var(--accent); background: var(--surface2); }
.card-name { font-size: 1.1rem; font-weight: 700; margin-bottom: .3rem; }
.card-date { font-size: .72rem; color: var(--text-muted); margin-bottom: .6rem; }
.card-attacks { list-style: none; }
.card-attacks li {
  font-size: .78rem;
  padding: .18rem 0;
  color: var(--text);
  display: flex;
  gap: .4rem;
}
.card-attacks li::before { content: "▸"; color: var(--accent); flex-shrink: 0; }

/* ── Table ── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: .8rem;
}
th {
  background: var(--surface2);
  padding: .6rem .8rem;
  text-align: left;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: .55rem .8rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
}
tr:hover td { background: var(--surface2); }
tr.active-row td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.muni-link {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  font-weight: 600;
}
.muni-link:hover { text-decoration: underline; }

/* ── Detail panel ── */
#detail-panel {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.5rem;
}
#detail-panel.visible { display: block; }
#detail-panel h2 {
  font-size: 1rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: .6rem;
}
/* marked.js 出力スタイル */
#detail-content h1,#detail-content h2,#detail-content h3 {
  margin: 1.2em 0 .4em;
  line-height: 1.3;
}
#detail-content h1 { font-size: 1.3rem; }
#detail-content h2 { font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: .3rem; }
#detail-content h3 { font-size: .95rem; color: var(--accent); }
#detail-content p { margin: .5em 0; line-height: 1.8; font-size: .88rem; }
#detail-content ul,#detail-content ol { padding-left: 1.4em; margin: .5em 0; font-size: .88rem; line-height: 1.8; }
#detail-content table { margin: .8em 0; }
#detail-content th { font-size: .78rem; }
#detail-content td { font-size: .78rem; }
#detail-content a { color: var(--accent); }
#detail-content strong { color: var(--yellow); }
#detail-content code {
  background: var(--surface2);
  padding: .1em .4em;
  border-radius: 4px;
  font-size: .85em;
}
#detail-close {
  float: right;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: .3rem .8rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: .8rem;
}
#detail-close:hover { border-color: var(--accent); color: var(--text); }

@media (min-width: 1024px) {
  .main-layout {
    grid-template-columns: 1fr 420px;
    grid-template-rows: auto auto 1fr;
  }
  .cards-section { grid-column: 1 / 2; }
  .table-section { grid-column: 1 / 2; }
  #detail-panel { grid-column: 2; grid-row: 1 / 4; display: block; position: sticky; top: 1rem; max-height: 90vh; overflow-y: auto; }
  #detail-panel:not(.visible) #detail-content { display: none; }
  #detail-panel:not(.visible)::after { content: "← 自治体を選ぶとレポートを表示"; display: block; color: var(--text-muted); font-size: .88rem; text-align: center; padding: 2rem; }
  #detail-close { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>🛡 営業支援 防災ダッシュボード</h1>

</header>

<div class="main-layout">

  <!-- 比較表 -->
  <section class="table-section">

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>自治体</th>
            <th>攻めどころ Top</th>
            <th>想定キーパーソン</th>
            <th>最大の機会</th>
            <th>更新日</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>

  <!-- 詳細パネル -->
  <div id="detail-panel">
    <h2 id="detail-title">レポート</h2>
    <button id="detail-close" onclick="closeDetail()">✕ 閉じる</button>

</div>

<script>
const DATA = [{"name": "鳥取県", "source": "report.md", "date": "2026-06-01", "attacks": ["令和8年度 災害時通信手段見直し業務（公告済み入札）", "砂防関係まるっとDXシステム構築業務委託（公告済み入札）", "スマホを活用した自主防災組織活動支援事業委託業務（公告済み入札）"], "top_attack": "令和8年度 災害時通信手段見直し業務（公告済み入札）", "keypersons": "知事（平井伸治）、危機管理部長（浜田定則）、県土整備部長（吉野睦）", "max_opportunity": "-", "markdown": "# 営業支援レポート: 鳥取県 / 防災\n- 作成日: 2026-06-01\n- 対象資料: 予算（令和7年度当初予算「主要事業一覧」PDF＋令和8年度入札公告ほか／収集日2026-06-01）、議事録（令和6年8月〜令和8年3月の地域県土警察・総務教育常任委員会＋令和8年2月定例会本会議〔知事・部長答弁〕／収集日2026-06-01）\n- QA担当による検証済み。出典のない主張・推測の断定は本文から除外し「データの限界・要確認事項」に隔離した。\n- **重要更新**: 予算金額の出典が公式PDF（直接取得・読取確認済み）に格上げされたため、前回の「note転記・要照合」注記を撤回。本文での数値提示は可（出典PDF: R7tousyosyuyouzigyou.pdf）。\n\n## 1. エグゼクティブサマリー（3行）\n- 首長（平井知事）の最上位方針は「ぼうさいこくたい2026 in 鳥取（令和8年10月、倉吉市）」「鳥取型防災（災害ケースマネジメント・支え愛マップ）」「山林火災の広域連携（自衛隊CH-47を3時間以内に投入判断する5月運用の新体制）」と本会議答弁で確認（確度高）。\n- 「今すぐ動ける案件」として令和8年度の入札公告が複数確定（災害時通信手段見直し業務・公告2026-05-21、砂防まるっとDX構築・公告2026-05-08、スマホ自主防災支援・公告2026-04-24）。\n- 「仕込み案件」は冬季倒木停電の事前伐採（残34地区が未完）・学校防災引渡し体制・避難所TKB拡充など、議員と部長が残課題を具体名で明言したテーマが有望。\n\n## 2. 攻めどころ（Top5／「今すぐ」と「仕込み」を区別）\n\n### 【今すぐ】第1位: 令和8年度 災害時通信手段見直し業務（公告済み入札） ／ 確度: 高\n- **根拠（事実）**: 入札公告「令和8年度鳥取県災害時通信手段見直し業務（委託・制限付一般競争入札、公告2026-05-21）」（出典 https://www.pref.tottori.lg.jp/322341.htm ）。関連発言: 森岡課長「防災行政無線の衛星系第三世代移行、悪天候時受信改善、400万円補正」(R7.12.17)／知事「4月に鳥取・広島で共同運用開始した防災情報システム」(R8.3.2本会議)。関連予算「危機管理通信ネットワーク機能向上事業 281,958千円（次世代防災行政無線への更新）」。\n- **狙い（推測・確度中）**: 公告済み＝発注確定の調達機会。衛星系移行・電波不感地対策・広域共同運用との整合を踏まえた通信手段再設計。次世代防災行政無線本体更新（281,958千円）の前段コンサル/調査案件の可能性。\n- **要確認**: 予定価格・締切・担当課・仕様が未取得（ページ本文取得不可）。応札可否判断の前に公告本文の取得が必須。\n\n### 【今すぐ】第2位: 砂防関係まるっとDXシステム構築業務委託（公告済み入札） ／ 確度: 中\n- **根拠（事実）**: 入札公告（委託・システム構築、公告2026-05-08、出典 https://www.pref.tottori.lg.jp/9511.htm ）。関連発言: 藤井課長「ドローン・衛星回線の災害調査をGISで効率化、出水期から実働、電波不感地から映像伝送」(R7.6.26)。関連予算「デジタル技術を活用した災害対応力強化事業 27,977千円（県土整備部）」。\n- **狙い（推測）**: 「構築」名称＝開発・実装フェーズ。砂防×DXの新規システム。映像・センサー連携やデータ基盤の余地。\n- **要確認**: 予定価格・締切・担当課・仕様未取得。\n\n### 【今すぐ】第3位: スマホを活用した自主防災組織活動支援事業委託業務（公告済み入札） ／ 確度: 中\n- **根拠（事実）**: 入札公告（委託、公告2026-04-24、出典 https://www.pref.tottori.lg.jp/328692.htm ）。関連予算「実効的避難体制整備事業 1,572千円（スマホアプリ『耳で聴くハザードマップ』導入等）」。\n- **狙い（推測）**: アプリ・コンテンツ運用委託の可能性。自主防災・地区防災計画普及と接続。\n- **要確認**: 予定価格・締切・担当課・仕様未取得。\n\n### 【仕込み】第4位: 山林火災の広域連携体制（首長最重点） ／ 確度: 高\n- **根拠（事実）**: 知事「5月運用の新連携で自衛隊CH-47を3時間以内に投入判断、昨年の岡山・島根山火事へ本県防災ヘリ応援、八頭町下野の火災は50分で鎮圧・90分で鎮火」(R8.3.17本会議)／前田伸一議員「東・中・西の広域消防局・自衛隊の平時からの連携が不可欠」(R8.3.17)。\n- **狙い（推測）**: 早期覚知・初動判断支援、広域消防・自衛隊との情報連携、ヘリ投入判断の意思決定支援。議員要望と知事方針が一致し温度感が高い。\n- **狙い時期**: 5月運用開始後の改善・高度化の切り口へ。\n\n### 【仕込み】第5位: 冬季倒木停電・事前伐採（孤立対策／部長が残課題を明言） ／ 確度: 高\n- **根拠（事実）**: 銀杏泰利議員「2023年大雪で国道482号の倒木断線により長時間大停電」(R8.3.13本会議)／浜田部長「冬季停電110件中倒木6割、事前伐採179か所中115完了〔進捗64%〕、未完34地区は鳥取市13・琴浦町10が多い、停電件数を令和4年131件→令和7年81件へ約4割削減」(R8.3.13)。関連予算「防災・減災のための危険木事前伐採集中対策事業 20,000千円」。\n- **狙い（推測）**: 未完34地区の伐採加速、伐採優先度判定（リスクマップ）、電力会社・林務との連携。\n- **狙い時期**: 令和8年度予算執行に合わせて。\n\n### 参考（仕込み・確度中）\n- **避難所環境整備・TKB拡充**: 福田次長「喫緊の課題」(R6.11.29)／北村次長「空気清浄機1,000台エアドッグ協定」(R7.9.12)。予算「TKB24プロジェクト 58,792千円（新規）」。知事の「避難所の柔軟運営」と整合。\n- **土砂災害警戒区域調査（若葉台）**: 吉野県土整備部長「令和8年度から若葉台10数か所を調査、航空レーザー・ドローン活用」(R8.3.17本会議)。R8年度着手確定。\n- **学校防災・引渡し体制**: 山川委員「保護者引渡しで渋滞、改善検討」(R8.1.21総務教育)。実災害（島根県東部地震）で露呈。\n\n## 3. キーパーソン\n| 名前・役職 | 関心テーマ | 接触ヒント |\n|---|---|---|\n| 知事（平井伸治） | ぼうさいこくたい2026、鳥取型防災、山林火災CH-47連携、広島との防災情報システム共同運用(R8.3.2・3.17本会議) | 最上位方針決定者。提案は知事メッセージとの整合が訴求の鍵 |\n| 危機管理部長（浜田定則） | 冬季倒木停電・事前伐採（残34地区を明言）、原子力防災(R8.3.13・R7.12.15) | 部の意思決定者。第5位の主担当 |\n| 県土整備部長（吉野睦） | 若葉台地区の土砂災害警戒区域調査（R8年度着手）、レーザー・ドローン測量(R8.3.17本会議) | 土砂DX調査の決定者 |\n| 北村 危機管理部次長兼危機管理政策課長 | 避難所災害関連死対策、県社協協定、南海トラフ受援(R7.7.22・9.12) | 協定・官民連携に積極。TKBの主担当 |\n| 木山 危機管理部次長兼危機管理政策課長 | 防災DX/ドローン、地区防災計画、備蓄(R6.9.17〜R8.1.21) | 防災DXの窓口 |\n| 森岡 危機対策・情報課長 | 通信ネットワーク衛星系第三世代移行（400万円補正）(R7.12.17) | 第1位（通信手段見直し）の最有力所管候補 |\n| 藤井 技術企画課長（県土整備部） | 国土強靱化、ドローン・GIS災害調査(頻出) | 第2位（砂防DX）の県土側キーマン |\n| 黒見 消防防災課長 | ぼうさいこくたい2026、緊急消防援助隊・山林火災応援(頻出) | ぼうさいこくたい事務局窓口 |\n| 大谷 危機管理政策課参事 | ぼうさいこくたい2026開催（倉吉市、37団体参画）(R7.11.21) | 大会の実務窓口 |\n| 議員（後押し役） | 前田伸一（山林火災・土砂）、銀杏泰利（倒木停電）、森（ドローン・備蓄・学校防災）、野坂（スフィア基準）、山川（学校引渡し体制） | 提案を後押ししやすい論点を提起 |\n\n※役職注記: 接触前に現職確認を推奨。\n\n## 4. 次アクション\n1. 【最優先・〜2026年6月中旬】公告済み3案件（災害時通信手段見直し2026-05-21／砂防まるっとDX2026-05-08／スマホ自主防災2026-04-24）の公告本文・予定価格・締切・担当課・仕様書を取得（応札可否判断の前提）。\n2. 【〜2026年6月】森岡課長（通信手段見直し所管候補）・藤井課長（砂防DX）へ接触し要件・連携余地を確認。\n3. 【〜2026年夏】ぼうさいこくたい2026事務局（黒見課長・大谷参事）へ協賛/出展を打診。\n4. 【仕込み・令和8年夏まで】浜田部長へ冬季倒木停電の伐採加速（残34地区）を提案。山林火災連携は5月運用後の改善切り口で。\n5. 【補強】令和7年6月・9月・12月定例会本会議（知事・部長答弁）の追加収集で首長方針の経年変化を確認。\n\n## 5. データの限界・要確認事項\n- **公告済み入札3件で予定価格・担当課・締切・仕様が全件未取得**。応札判断・規模感の確定不可。商談で規模を断定しない。\n- **前年比・増減は全事業「未確認」**。令和6年度当初予算も未取得で複数年推移が追えない。\n- **各補正予算の防災事業はPDF未取得**。補正での増額・新規計上シグナルは確認できず。\n- **本会議は令和8年2月定例会分のみ取得**。令和6・7年度の知事・部長答弁は網羅取得できておらず過年度方針の経年変化は未確認。\n- **委員会は地域県土警察・総務教育のみ**。福祉生活病院・農林水産商工常任委員会は未取得。\n- **土砂災害警戒情報の見直しCL（令和8年5月運用開始予定）は本日時点で既に運用開始済みの可能性大**。提案は「運用後の改善・空振り低減」へ切替を。\n- **入札案件と当初予算事業の対応関係は推測**。仕様書での確認が必要。\n\n## 出典一覧（取得日: いずれも2026-06-01）\n- 予算掲載ページ: https://www.pref.tottori.lg.jp/321465.htm\n- 予算原資料PDF（直接取得・読取確認済み）: https://www.pref.tottori.lg.jp/secure/1381609/R7tousyosyuyouzigyou.pdf\n- 補正第1号（防災事業なし）: https://www.pref.tottori.lg.jp/321691.htm\n- 財政課トップ: https://www.pref.tottori.lg.jp/zaiseika/\n- 入札情報ページ: https://www.pref.tottori.lg.jp/9511.htm\n- 災害時通信手段見直し業務（公告2026-05-21）: https://www.pref.tottori.lg.jp/322341.htm\n- スマホ自主防災支援（公告2026-04-24）: https://www.pref.tottori.lg.jp/328692.htm\n- 総合防災情報システム（広島県共同運用R7.4.1開始）: https://www.pref.tottori.lg.jp/324033.htm\n- 防災情報ポータルサイト: https://tottori.bosai.info/\n- 議事録（委員会）:\n  - R6.8.21: https://www.pref.tottori.lg.jp/item/1360288.htm\n  - R6.9.17: https://www.pref.tottori.lg.jp/item/1360290.htm\n  - R6.11.29: https://www.pref.tottori.lg.jp/item/1360293.htm\n  - R7.1.23（総務教育）: https://www.pref.tottori.lg.jp/item/1389348.htm\n  - R7.1.23（地域県土）: https://www.pref.tottori.lg.jp/item/1423234.htm\n  - R7.6.26: https://www.pref.tottori.lg.jp/item/1393891.htm\n  - R7.7.22: https://www.pref.tottori.lg.jp/item/1393892.htm\n  - R7.8.21: https://www.pref.tottori.lg.jp/item/1393893.htm\n  - R7.9.12: https://www.pref.tottori.lg.jp/item/1393894.htm\n  - R7.10.6: https function showDetail(idx) {
  const d = DATA[idx];
  document.getElementById('detail-title').textContent = d.name + ' / ' + d.source;
  document.getElementById('detail-content').innerHTML = marked.parse(d.markdown);
  const panel = document.getElementById('detail-panel');
  panel.classList.add('visible');
  // card highlight
  document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i === idx));
  document.querySelectorAll('#table-body tr').forEach((r, i) => r.classList.toggle('active-row', i === idx));
  // mobile scroll
  if (window.innerWidth < 1024) panel.scrollIntoView({ behavior: 'smooth' });
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('#table-body tr').forEach(r => r.classList.remove('active-row'));
}

function buildCards() {
  const wrap = document.getElementById('cards');
  DATA.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-name">${d.name}</div>
      <div class="card-date">更新: ${d.date} &nbsp;|&nbsp; ${d.source}</div>
      <ul class="card-attacks">${d.attacks.map(a => `<li>${a}</li>`).join('')}</ul>
    `;
    el.addEventListener('click', () => showDetail(i));
    wrap.appendChild(el);
  });
}

function buildTable() {
  const tbody = document.getElementById('table-body');
  DATA.forEach((d, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a class="muni-link" onclick="showDetail(${i})">${d.name}</a></td>
      <td>${d.top_attack}</td>
      <td>${d.keypersons}</td>
      <td style="max-width:240px;font-size:.75rem">${d.max_opportunity}</td>
      <td style="white-space:nowrap">${d.date}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('cards').closest('.cards-section')
  .querySelector('.section-title').textContent =
  `自治体一覧 (${DATA.length} 件)`;

buildCards();
buildTable();
</script>
