* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; background: var(--bg); color: var(--text); }
header {

.page { max-width: 1600px; margin: 0 auto; padding: 1.2rem 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; }

.card-name { font-size: 1rem; font-weight: 700; margin-bottom: .2rem; }

.badge-budgeted  { background: color-mix(in srgb,var(--yellow) 18%,transparent); color: var(--yellow); border: 1px solid var(--yellow); }

.muni-link { color: var(--accent); cursor: pointer; font-weight: 600; }

  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.dp-section:last-child { border-right: none; }
.dp-section-title {

.dp-body p { font-size: .82rem; line-height: 1.75; margin: .35em 0; }
.dp-body ul, .dp-body ol { padding-left: 1.3em; font-size: .82rem; line-height: 1.75; margin: .35em 0; }

.dp-body strong { color: var(--yellow); }
.dp-body a { color: var(--accent); word-break: break-all; }
.dp-body code { background: var(--surface2); padding: .1em .35em; border-radius: 3px; font-size: .8em; }

.dp-body .tbl-wrap { overflow-x: auto; margin: .5em 0; }
.dp-body table { width: 100%; border-collapse: collapse; font-size: .75rem; white-space: nowrap; }
.dp-body th { background: var(--surface2); padding: .4rem .6rem; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); }
.dp-body td { padding: .38rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; white-space: normal; }

.dp-body td:first-child { font-weight: 600; }

.summary-list { list-style: none; padding: 0; }

な避難支援プランの整備に取り組む」（井原議員質問への答弁）\n- **防災行政無線**: 令和7年4月1日から天萬庁舎のモーター式サイレン放送を停止。定時音楽放送は継続（板井議員質問）\n- **テノヒラ役場**: LINE情報発信サービスの登録者数は約3,700人（﨏田議員質問への答弁）\n\n## 次アクション提案\n\n1. **【最優先・令和8年度内】総務課（防災担当）へのアプローチ**: 水道水系改善の「施設整備の方向性の整理」が令和8年度中に完了予定。整理結果が出る前（遅くとも令和8年秋〜冬）に、水源監視・緊急給水・配水池整備に関するソリューション提案を行い、令和9年度予算要求サイクルに乗せる。接触先: 総務課（法勝寺庁舎2階）TEL: 0859-66-3112\n2. **【令和8年6〜7月】「震災に強いまちづくり促進事業」の詳細把握**: 事業内容（耐震化補助かハード整備か）が未確認のため、総務課または入札公告ページで事業詳細を確認し、提案対象かどうかを判断する。\n3. **【令和8年度中〜令和9年度】要支援者避難支援・名簿共有条例への仕込み**: 条例制定の検討段階。個別避難計画策定支援・名簿管理システムの提案と、令和9年度「災害ボランティアセンター運営訓練」に向けた支援提案を同期間に実施。\n4. **【令和8年6月〜】情報発信強化への提案**: 地震時の情報発信が議会で問題提起され「検討する」と答弁された直後のタイミング。テノヒラ役場（LINE）の到達率向上・多チャネル化の提案書を持参。\n\n## 要確認事項（検証で棄却・未確認だったもの）\n\n| 項目 | 理由 |\n|------|------|\n| 「震災に強いまちづくり促進事業」の具体的内容 | 議会だよりに事業名と金額のみ。内容の裏取り不可 |\n| 防災グッズ購入補助の計上額 | 「当初予算に計上」との答弁要旨のみ。金額記載なし |\n| 水道水系改善調査委託の委託額・委託先 | 金額不明 |\n| 消防費款計のうち西部広域行政管理組合への負担金額 | 款計に含まれると推定されるが分離不可 |\n| 土木費の細目（河川費・急傾斜地対策・砂防等） | 予算書本体PDFが403エラーで未取得 |\n| 地域防災計画・耐震改修促進計画の重点方針 | URL把握済みだが本文未取得 |\n| 会議録本文（全発言）の裏取り | 全PDF（令和6〜8年）がスキャン画像型のためテキスト抽出不可。議会だより要旨のみに依拠 |\n| 議会だより第84〜86号（R7年6月・9月・12月議会）の防災関連質問 | 本分析では第83・87号のみ取得 |\n\n## 出典一覧（取得日: いずれも2026-06-02）\n\n| 資料名 | URL | 発行日 |\n|--------|-----|--------|\n| なんぶ議会だより第83号（令和7年3月議会） | https://www.town.nanbu.tottori.jp/user/filer_public/0e/8a/0e8a31c9-8896-487c-9557-b8650a373671/nanbu-gikai-dayori-dai-83-gou.pdf | 令和7年5月 |\n| なんぶ議会だより第87号（令和8年3月議会） | https://www.town.nanbu.tottori.jp/user/filer_public/93/3c/933c09bf-c34b-41e6-8283-482567efabc8/nanbu-gikai-dayori-dai-87-gou-pdf.pdf | 令和8年5月 |\n| 令和7年第1回定例議会審議結果 | https://www.town.nanbu.tottori.jp/user/filer_public/16/64/16646930-e008-4c9f-a1a5-e4b0e434b6ef/reiwa-7-nen-dai-1-kai-nanbu-mati-teirei-gikai-singi-kekka.pdf | 令和7年3月21日 |\n| 令和8年第2回定例議会審議結果 | https://www.town.nanbu.tottori.jp/user/filer_public/c8/ce/c8ce2655-7a83-4129-9466-d7297e1bb02b/reiwa-8-nen-dai-2-kai-nanbu-mati-teirei-gikai-singi-kekka-3-gatu-2-niti-18-niti.pdf | 令和8年3月18日 |\n| 西部広域行政管理組合 令和7年度執行済み案件 | https://www.tot , "markdown": "# 営業支援レポート: 鳥取県 / 防災\n- 作成日: 2026-06-01\n- 対象資料: 予算（令和7年度当初予算「主要事業一覧」PDF＋令和8年度入札公告＋予算DB個別ドキュメント追加収集分／収集日2026-06-01）、議事録（令和6年8月〜令和8年3月の地域県土警察・総務教育常任委員会＋令和8年2月定例会本会議〔知事・部長答弁〕／収集日2026-06-01）\n- QA担当による検証済み。出典のない主張・推測の断定は本文から除外し「要確認事項」に隔離した。\n\n## 1. エグゼクティブサマリー（5行）\n- 【最重要・入札前の好機】危機対策・情報課所管の「**災害対策本部設備機能強化事業**」がR8で予算化済みだが**調達未実施**（155,146千円／複数年計381,843千円・R9に重心）。入札公告前のいま要件形成・情報提供で正規に関与できる最有力タイミング（確度中）。\n- 【映像ハード・5年契約】原子力安全対策課「原子力防災情報システム維持運用事業」で**県内47か所の監視カメラ更新＋映像配信システム整備**が令和8年4月〜令和13年3月の5年計画で確定（総額25,101千円）。\n- 首長（平井知事）の最上位方針は「ぼうさいこくたい2026 in 鳥取（令和8年10月、倉吉市）」「鳥取型防災」「山林火災の広域連携（自衛隊CH-47を3時間以内に投入判断する5月運用の新体制）」と本会議答弁で確認（確度高）。\n- 「今すぐ動ける案件」として令和8年度の入札公告が複数確定（災害時通信手段見直し・公告2026-05-21、砂防まるっとDX構築・公告2026-05-08、スマホ自主防災支援・公告2026-04-24）。\n- 「短期の仕込み」は冬季倒木停電の事前伐採（残34地区が未完）・避難所TKB拡充など、議員と部長が残課題を具体名で明言したテーマ。\n\n## 2. 攻めどころ（優先順位つき）\n\n| 順位 | 提案テーマ | 根拠（予算/発言の事実） | 想定キーパーソン | 確度 | 出典 |\n|------|-----------|------------------------|------------------|------|------|\n| 1（最優先・入札前） | 【予算化・未公告】災害対策本部設備機能強化事業（調達未実施） | R8当初152,737千円＋補正2,409千円＝155,146千円。所管=危機対策・情報課。事業名はユーザー確認（予算DB文字化けで不読だが事業は特定済み） | 危機対策・情報課（0857-26-7789 / kikitaisaku-jouhou@pref.tottori.lg.jp） | 中 | https://db.pref.tottori.jp/yosan/R8Yosan_Koukai.nsf/72079a474c40091b4925747f002bb433/1bde4a787eba1b0449258d8f00328f15?OpenDocument |\n| 2（最優先・複数年） | 【予算化・未公告】同事業 複数年計画（R8〜R9計381,843千円） | 総額381,843千円（R8:152,737＋R9:229,106）。R9に重心の2か年構造。 | 危機対策・情報課（同上） | 中 | https://db.pref.tottori.jp/yosan/R8Yosan_Koukai.nsf/72079a474c40091b4925747f002bb433/01312eef0365638049258d8f00328f1c?OpenDocument |\n| 3（映像ハード・5年） | 【予算化・未公告】原子力防災情報システム維持運用事業（47か所監視カメラ更新・映像配信） | 47か所カメラ更新＋映像配信。R8.4〜R13.3（5年）。総額25,101千円（R9:7,930／R10-R12各4,384／R13:4,019） | 原子力安全対策課（0857-26-7854 / genshiryoku-anzen@pref.tottori.lg.jp） | 中 | https://db.pref.tottori.jp/yosan/R8Yosan_Koukai.nsf/72079a474c40091b4925747f002bb433/821f89ff12f7a6f149258d8f00328f19?OpenDocument |\n| 4（今すぐ） | 【公告済み】令和8年度 災害時通信手段見直し業務 | 委託・制限付一般競争入札、公告2026-05-21／森岡課長「衛星系第三世代移行・悪天候時受信改善・400万円補正」( 対象外**: 警察本部の映像系（庁舎テレビシステム等／R8: 418,406千円）は警察業務用で防災提案の対象外。\n\n## 3. キーパーソン\n| 名前・役職 | 関心テーマ | 接触ヒント |\n|---|---|---|\n| 知事（平井伸治） | ぼうさいこくたい2026、鳥取型防災、山林火災CH-47連携、広島との防災情報システム共同運用 | 最上位方針決定者 |\n| 危機管理部長（浜田定則） | 冬季倒木停電・事前伐採（残34地区）、原子力防災 | 部の意思決定者 |\n| 県土整備部長（吉野睦） | 若葉台土砂災害警戒区域調査（R8着手）、レーザー・ドローン測量 | 土砂DX調査の決定者 |\n| 森岡 危機対策・情報課長 | 通信NW衛星系移行（400万円補正）、ポータル運用保守所管 | **第1〜4・7・8・9位の最有力所管**。映像・通信・保守の中核窓口 |\n| 原子力安全対策課（担当者未特定） | 47か所監視カメラ更新・映像配信（R8〜R13） | **第3位の所管**（genshiryoku-anzen@pref.tottori.lg.jp / 0857-26-7854） |\n| 藤井 技術企画課長（県土整備部） | 国土強靱化、ドローン・GIS災害調査 | 第5位（砂防DX）の県土側キーマン |\n| 北村 危機管理部次長 | 避難所災害関連死対策、県社協協定、南海トラフ受援 | 協定・官民連携に積極 |\n| 木山 危機管理部次長 | 防災DX/ドローン、地区防災計画、備蓄 | 第6位（スマホ自主防災）窓口 |\n| 黒見 消防防災課長 | ぼうさいこくたい2026、山林火災応援 | ぼうさいこくたい事務局窓口 |\n| 大谷 危機管理政策課参事 | ぼうさいこくたい2026開催（倉吉市、37団体参画） | 大会の実務窓口 |\n\n## 4. 次アクション\n1. 【最優先・即時】危機対策・情報課（0857-26-7789）へ接触し、「災害対策本部設備機能強化事業」（155,146千円／複数年計381,843千円）の事業内容・調達予定時期・要件を確認。入札公告前に参考見積・技術デモで関与。\n2. 【最優先・即時】原子力安全対策課（0857-26-7854）へ接触し、47か所カメラ更新の発注単位・分割・各年度公告時期を確認。\n3. 【〜6月中旬】公告済み3案件の公告本文・予定価格・締切・担当課・仕様を取得。\n4. 【〜夏】ぼうさいこくたい2026事務局（黒見課長・大谷参事）へ協賛/出展打診。\n5. 【仕込み】浜田部長へ冬季倒木停電の伐採加速（残34地区）を提案。山林火災連携は5月運用後の改善切り口で。\n6. 【収集補強】映像3事業（1bde4a78／01312eef／821f89ff）をブラウザ直接閲覧で事業名・概要・調達予定を確定。電子入札システム（nyusatsu.pref.tottori.jp）の復旧確認＋映像系キー探索。\n\n## 5. データの限界・要確認事項\n- **「災害対策本部設備機能強化事業」の仕様詳細が未取得**: 事業名はユーザー確認済み。詳細仕様・調達単位はブラウザ直接閲覧で確定すること。\n- **1bde4a78と01312eefが同一事業か別事業かは未確認**。R8額の差（155,146 vs 152,737）は補正分と推測。\n- 「調達未実施」はユーザー確認情報で、raw入札情報ページに対応公告なし。公告時期不明。\n- **47か所カメラ更新の調達区分・分割・各年度公告時期は未確認**。\n- **公告済み入札3件で予定価格・担当課・締切・仕様が全件未取得**。商談で規模を断定しない。\n- 電子入札システム（http://nyusatsu.pref.tottori.jp/）はHTTP 503継続。委託役務DBは文字化けで全案件取得不可。\n- 前年比・増減は全事業未確認。本会議は令和8年2月定例会分のみ。委員会は地域県土警察・総務教育のみ。\n- 土砂災害警戒情報の見直しCL（令和8年5月運用開始予定）は本日時点で運用開始済みの可能性大→提案は運用後の改善へ切替を。\n\n## 出典一覧（取得日: いずれも2026-06-01）\n- 映像予算 1bde4a78: https://db.pref.tottori.jp/yosan/R8Yosan_Koukai.nsf/72079a474c40091b4925747f002bb433/1bde4a787eba1b0449258d8f00328f15?OpenDocument&Highlight=0,%E6%98%A0%E5%83%8F\n- 映像予算 01312eef: https://d /* Section order for detail panel: label → regex that matches the ## heading */
const SECTIONS = [
  { key: 'summary',   label: 'エグゼクティブサマリー', re: /エグゼクティブ|サマリ/ },
  { key: 'attacks',   label: '攻めどころ',             re: /攻めどころ/ },
  { key: 'budget',    label: '防災予算',               re: /防災予算/ },
  { key: 'minutes',   label: '議会・首長の関心',        re: /議会|首長/ },
  { key: 'actions',   label: '次アクション',            re: /次アクション/ },
  { key: 'issues',    label: '要確認事項',              re: /要確認/ },
];

function parseSections(markdown) {
  const result = {};
  const lines = markdown.split('\n');
  let cur = null;
  for (const line of lines) {
    if (line.startsWith('## ')) {
      const heading = line.slice(3).trim();
      cur = null;
      for (const s of SECTIONS) {
        if (s.re.test(heading)) { cur = s.key; result[cur] = result[cur] || []; break; }
      }
    } else if (cur) {
      result[cur].push(line);
    }
  }
  // trim leading/trailing blank lines
  for (const k of Object.keys(result)) {
    while (result[k].length && !result[k][0].trim()) result[k].shift();
    while (result[k].length && !result[k][result[k].length-1].trim()) result[k].pop();
  }
  return result;
}

function renderSection(lines) {
  const md = lines.join('\n');
  let html = marked.parse(md);
  // wrap tables in scrollable div
  html = html.replace(/<table>/g, '<div class="tbl-wrap"><table>').replace(/<\/table>/g, '</table></div>');
  return `<div class="dp-body">${html}</div>`;
}

function badgesHtml(s, size) {
  return [
    s['公告済み'] > 0       ? `<span class="badge-status badge-announced">公告済み ${s['公告済み']}件</span>` : '',
    s['予算化・未公告'] > 0  ? `<span class="badge-status badge-budgeted">予算化・未公告 ${s['予算化・未公告']}件</span>` : '',
    s['仕込み'] > 0          ? `<span class="badge-status badge-pipeline">仕込み ${s['仕込み']}件</span>` : '',
  ].filter(Boolean).join('');
}

function showDetail(idx) {
  const d = DATA[idx];
  document.getElementById('dp-title').textContent = d.name + ' / 防災';
  document.getElementById('dp-meta').textContent = '更新: ' + d.date;

  const sections = parseSections(d.markdown);
  const grid = document.getElementById('dp-grid');
  grid.innerHTML = '';

  for (const s of SECTIONS) {
    if (!sections[s.key] || !sections[s.key].length) continue;
    const div = document.createElement('div');
    div.className = 'dp-section';
    div.innerHTML = `<div class="dp-section-title">${s.label}</div>${renderSection(sections[s.key])}`;
    grid.appendChild(div);
  }

  const panel = document.getElementById('detail-panel');
  panel.classList.add('visible');
  document.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('active', i === idx));
  document.querySelectorAll('#table-body tr').forEach((r, i) => r.classList.toggle('active-row', i === idx));
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('visible');
  document.getElementById('dp-grid').innerHTML = '';
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.querySelectorAll('#table-body tr').forEach(r => r.classList.remove('active-row'));
}

function buildCards() {
  const wrap = document.getElementById('cards');
  DATA.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-name">${d.name}</div>
      <div class="card-date">更新: ${d.date}</div>
      <div class="status-badges">${badgesHtml(d.status || {})}</div>
      <ul class="card-attacks">${d.attacks.map(a => `<li>${a}</li>`).join('')}</ul>`;
    el.addEventListener('click', () => showDetail(i));
    wrap.appendChild(el);
  });
  document.getElementById('cards-title').textContent = `自治体一覧 (${DATA.length} 件)`;
}

function buildTable() {
  const tbody = document.getElementById('table-body');
  DATA.forEach((d, i) => {
    const s = d.status || {};
    const b = [
      s['公告済み'] > 0      ? `<span class="badge-status badge-announced">公告済み ${s['公告済み']}</span>` : '',
      s['予算化・未公告'] > 0 ? `<span class="badge-status badge-budgeted">予算化 ${s['予算化・未公告']}</span>` : '',
      s['仕込み'] > 0         ? `<span class="badge-status badge-pipeline">仕込み ${s['仕込み']}</span>` : '',
    ].filter(Boolean).join(' ');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a class="muni-link" onclick="showDetail(${i})">${d.name}</a></td>
      <td style="white-space:nowrap">${b || '-'}</td>
      <td>${d.top_attack}</td>
      <td>${d.keypersons}</td>
      <td style="white-space:nowrap">${d.date}</td>`;
    tbody.appendChild(tr);
  });
}

buildCards();
buildTable();
</script>
</body>
</html>
